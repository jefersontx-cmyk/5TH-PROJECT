<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TX Performance</title>
    <link rel="stylesheet" href="CSS/estiloprincipal.css">
</head>

<body>

    <!-- ========================
         HEADER — La barra superior con el nombre TX
         Es lo primero que se ve, forma de rectángulo largo
    ======================== -->
    <header class="header">
        <img src="images/logo2.png" alt="Logo TX" class="header-logo" height="250%">
    </header>

    <!-- ========================
         NAV — Barra de navegación
         Links para moverse entre secciones
    ======================== -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Productos</a></li>
            <li><a href="#">Nosotros</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <!-- ========================
         SLOGAN — Sección principal de contenido
         Aquí va el texto de inspiración y el logo de fondo
    ======================== -->
    <section class="slogan">
        <!-- Este div es el logo TX que se ve de fondo, casi invisible -->
        <div class="slogan-fondo">
            <img src="images/fondo.jpeg" alt="Logo TX de fondo" class="slogan-logo">
        </div>
        <!-- Este div es el texto principal que el usuario lee -->
        <div class="slogan-contenido">
            <h1>Velocidad. Control. <span>Instinto.</span></h1>
            <p>No es solo ropa. Es la forma en que te mueves.</p>
        </div>
    </section>

    <!-- ========================
         FOOTER — Pie de página
         Derechos reservados e íconos de redes sociales
    ======================== -->
    <footer class="footer">
        <p class="footer-derechos">
            &copy; Derechos reservados &mdash; Estudiantes del IPC: Jeferson Ramírez y Carlos Contreras
        </p>
        <div class="footer-redes">
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">WhatsApp</a>
        </div>
    </footer>

</body>
</html>
